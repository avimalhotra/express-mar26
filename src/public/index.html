
<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Express JS</title>
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
     <link rel="stylesheet" href="/css/style.css">
</head>
<body>
     <div class="container">
          <h1>Hello Express JS</h1>
          <p>Express JS APP</p>

          <form class="row align-items-center">
               <div class="col-auto"><label for="car" class="form-label">Cars: </label></div>
               <div class="col-auto"><input type="search" name="car" class="form-control" id="car" required></div>
               <div class="col-auto"><button class="btn btn-outline-primary">Search</button></div>
               <div class="col-auto"><output class="err"></output></div>
          </form>
          <ol class="carsdata"></ol>
          <hr>
          <h2>Get Data</h2>
          <form action="/search">
               <div class="mb-3">
                    <div class="row align-items-center">
                         <div class="col-auto"><label for="name" class="form-label">Name</label></div>
                         <div class="col-auto"><input type="text" name="name" id="name" required class="form-control"></div>
          
                         <div class="col-auto"><label for="email" class="form-label">Email</label></div>
                         <div class="col-auto"><input type="email" name="email" id="email" required class="form-control"></div>
                         
                         <div class="col-auto"><button type="submit" class="btn btn-outline-primary">Search</button></div>
                    </div>
               </div>     
          </form>
          <h2>Post data</h2>
          <form action="/signin" method="post">
               <div class="mb-3">
                    <div class="row align-items-center">
                         <div class="col-auto"><label for="name" class="form-label">Email</label></div>
                         <div class="col-auto"><input type="email" name="email" id="email" required class="form-control"></div>
          
                         <div class="col-auto"><label for="pass" class="form-label">Password</label></div>
                         <div class="col-auto"><input type="password" name="pass" id="pass" required class="form-control"></div>
                         
                         <div class="col-auto"><button type="submit" class="btn btn-outline-primary">Sign In</button></div>
                    </div>
               </div>     
          </form>
          <hr>
          <button class="btn btn-primary cars">Cars</button>
          <button class="btn btn-primary bikes">Bikes</button>

          <table class="table table-bordered border-primary my-3">
               <thead><tr><th>ID</th><th>Name</th></tr></thead>
               <tbody></tbody>
          </table>
     </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
     "use strict";

     document.querySelector(".cars").addEventListener("click", async function(){
         
          document.querySelector("table tbody").innerHTML="";
          const res=await fetch("/api/cars");
          const data=await res.json();
          
          data.forEach(i=>{
               document.querySelector("table tbody").innerHTML+=`<tr><td>${i.id}</td><td>${i.name}</td></tr>`;
          })

     });

     document.querySelector(".bikes").addEventListener("click", async function(){
          const res=await fetch("/api/bikes");
          const data=await res.json();
          
          console.log(data);
     });

     document.querySelector("#car").addEventListener("input",function(){
          document.querySelector("ol.carsdata").innerHTML="";
          if(this.value){
               fetch(`/api/cars/${this.value}`).then(i=>i.json()).then(i=>{
          
               if(i[0].error=="Car not found"){
                    document.querySelector(".err").innerHTML="no car found";
               }
               else{
                    document.querySelector(".err").innerHTML="car found";
                    i.forEach(j=>{
                         document.querySelector("ol.carsdata").innerHTML=`<li>${j.name}</li>`;
                    })
               }
          });
          }

     });



</script>
</body>
</html>
